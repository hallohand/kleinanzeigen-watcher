name: digest

on:
  schedule:
    # 07:00 UTC = 09:00 CEST (Sommer) bzw. 08:00 CET (Winter).
    # Im Winter laeuft der Digest also um 08:00 lokaler Zeit; tolerierbar.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: Send top-5 digest to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m kleinanzeigen_watcher top5 --config config.yaml --limit 5 --telegram
