[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kleinanzeigen-watcher"
version = "0.1.0"
description = "Polls Kleinanzeigen.de search results and notifies via Telegram on new listings."
requires-python = ">=3.11"
authors = [{ name = "Jonas Seidel", email = "jonas.seidel@aroniaberry.ca" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
kleinanzeigen-watcher = "kleinanzeigen_watcher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
